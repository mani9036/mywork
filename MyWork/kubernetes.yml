apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  namespace: default

spec:
    replicas: 5
    selector: 
      matchLabels: 
        app: my-pod

    template:
      metadata:
        labels:
          app: my-prod

    spec:
        containers:
                - name: application-dev
                  image: nginx:20-alpine
                  imagePullPolicy: IfNotPresent

                  ports:
                      -containerPort:80

                  resources:
                    requests:
                      cpu: "100m"
                      memory: "128Mi"
                    limits:
                      cpu: "500m"
                      memory: "512Mi"

                  livenessProbe:
                    httpGet:
                      path: /
                      port: 80
                    initialDelaySeconds: 10
                    periodSeconds: 10

    